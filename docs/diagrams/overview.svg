<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="660" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionSaga - where it sits</text>
  <text class="subtitle" x="40" y="78">One package, in process: no broker, no database. You declare the steps; Saga&lt;TContext&gt; runs them and unwinds them.</text>

  <!-- your code -->
  <rect class="ext" x="40" y="110" width="280" height="96" rx="14"/>
  <text class="label" x="180" y="142" text-anchor="middle">Your code</text>
  <text class="small" x="180" y="166" text-anchor="middle">your TContext and the step delegates</text>
  <text class="small" x="180" y="188" text-anchor="middle">(forward action + compensation)</text>

  <path class="flow" d="M320,158 L398,158"/>
  <text class="edge" x="359" y="148" text-anchor="middle">steps</text>

  <!-- builder -->
  <rect class="step" x="400" y="110" width="400" height="168" rx="14"/>
  <text class="label" x="600" y="138" text-anchor="middle">SagaBuilder&lt;TContext&gt;</text>
  <text class="code" x="600" y="164" text-anchor="middle">AddStep, AddResultStep</text>
  <text class="code" x="600" y="186" text-anchor="middle">AddConditionalStep, AddConditionalResultStep</text>
  <text class="code" x="600" y="208" text-anchor="middle">AddSubSaga, AddParallelGroup</text>
  <text class="code" x="600" y="230" text-anchor="middle">WithCompensationRetry, WithRollbackBudget</text>
  <text class="code" x="600" y="252" text-anchor="middle">WithObserver, WithDiagnostics</text>

  <!-- DI -->
  <rect class="step" x="880" y="110" width="280" height="110" rx="14"/>
  <text class="label" x="1020" y="140" text-anchor="middle">DI (optional)</text>
  <text class="code" x="1020" y="164" text-anchor="middle">services.AddOrionSaga()</text>
  <text class="small" x="1020" y="186" text-anchor="middle">registers one SagaDiagnostics singleton</text>
  <text class="small" x="1020" y="206" text-anchor="middle">to pass to WithDiagnostics</text>
  <path class="flow" d="M880,165 L802,165"/>
  <text class="edge" x="841" y="155" text-anchor="middle">inject</text>

  <!-- build -->
  <path class="flow" d="M600,278 L600,328"/>
  <text class="code" x="612" y="308">Build()</text>

  <!-- saga -->
  <rect class="step" x="400" y="330" width="400" height="90" rx="14"/>
  <text class="label" x="600" y="358" text-anchor="middle">Saga&lt;TContext&gt;</text>
  <text class="code" x="600" y="382" text-anchor="middle">RunAsync(context, cancellationToken)</text>
  <text class="small" x="600" y="404" text-anchor="middle">steps in order; on failure, undo completed steps newest-first</text>

  <!-- your code runs it -->
  <path class="flow" d="M180,206 L180,375 L398,375"/>
  <text class="edge" x="290" y="365" text-anchor="middle">run with your context</text>

  <!-- result -->
  <path class="flow" d="M800,375 L878,375"/>
  <text class="edge" x="839" y="365" text-anchor="middle">returns</text>
  <rect class="ok" x="880" y="300" width="280" height="150" rx="14"/>
  <text class="label" x="1020" y="328" text-anchor="middle">SagaResult</text>
  <text class="small" x="1020" y="352" text-anchor="middle">Outcome: Succeeded, Failed, Cancelled</text>
  <text class="small" x="1020" y="374" text-anchor="middle">FailedStep, Failure, TimedOut</text>
  <text class="small" x="1020" y="396" text-anchor="middle">StepsCompleted / Compensated / Skipped</text>
  <text class="small" x="1020" y="418" text-anchor="middle">CompensationFailures, RollbackTimedOut</text>
  <text class="small" x="1020" y="440" text-anchor="middle">RolledBackCleanly</text>

  <!-- hooks -->
  <path class="flow" d="M480,420 L480,470 L210,470 L210,508"/>
  <text class="edge" x="345" y="492" text-anchor="middle">notifies, if attached</text>
  <path class="flow" d="M600,420 L600,508"/>
  <text class="edge" x="612" y="480">counts, if attached</text>
  <path class="flow" d="M720,420 L720,470 L990,470 L990,508"/>
  <text class="edge" x="855" y="492" text-anchor="middle">spans, if listened to</text>

  <rect class="ext" x="40" y="510" width="340" height="120" rx="14"/>
  <text class="label" x="210" y="540" text-anchor="middle">ISagaObserver (yours)</text>
  <text class="small" x="210" y="564" text-anchor="middle">step completed / failed / skipped,</text>
  <text class="small" x="210" y="586" text-anchor="middle">compensated / compensation failed, OnProgress</text>
  <text class="small" x="210" y="608" text-anchor="middle">an exception it throws is swallowed</text>

  <rect class="step" x="420" y="510" width="360" height="120" rx="14"/>
  <text class="label" x="600" y="540" text-anchor="middle">SagaDiagnostics meter</text>
  <text class="small" x="600" y="564" text-anchor="middle">Moongazing.OrionSaga, via WithDiagnostics</text>
  <text class="code" x="600" y="588" text-anchor="middle">orion.saga.runs / steps / compensations</text>
  <text class="small" x="600" y="610" text-anchor="middle">tagged orion.outcome</text>

  <rect class="step" x="820" y="510" width="340" height="120" rx="14"/>
  <text class="label" x="990" y="540" text-anchor="middle">SagaActivitySource</text>
  <text class="small" x="990" y="564" text-anchor="middle">Moongazing.OrionSaga, always on;</text>
  <text class="small" x="990" y="586" text-anchor="middle">spans only start when a listener subscribes</text>
  <text class="code" x="990" y="610" text-anchor="middle">orionsaga.run / step / compensation</text>
</svg>
