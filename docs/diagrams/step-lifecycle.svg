<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="682" viewBox="0 0 1200 682">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="682" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionSaga - one step on the way forward</text>
  <text class="subtitle" x="40" y="78">How Saga.RunAsync decides whether a step is skipped, completed, retried, failed or cancelled.</text>

  <!-- row 1 -->
  <rect class="step" x="40" y="140" width="150" height="80" rx="14"/>
  <text class="label" x="115" y="174" text-anchor="middle">Step reached</text>
  <text class="small" x="115" y="196" text-anchor="middle">in declared order</text>
  <path class="flow" d="M190,180 L228,180"/>

  <polygon class="decision" points="320,130 410,180 320,230 230,180"/>
  <text class="code" x="320" y="177" text-anchor="middle">condition</text>
  <text class="small" x="320" y="197" text-anchor="middle">if declared</text>

  <path class="flow" d="M410,180 L458,180"/>
  <text class="edge" x="434" y="170" text-anchor="middle">true</text>

  <rect class="step" x="460" y="140" width="220" height="80" rx="14"/>
  <text class="label" x="570" y="166" text-anchor="middle">Forward attempt</text>
  <text class="code" x="570" y="188" text-anchor="middle">Execute(ctx, token)</text>
  <text class="small" x="570" y="208" text-anchor="middle">token linked to Timeout, if set</text>
  <path class="flow" d="M680,180 L728,180"/>

  <polygon class="decision" points="810,130 890,180 810,230 730,180"/>
  <text class="label" x="810" y="185" text-anchor="middle">result</text>

  <path class="flow" d="M890,180 L938,180"/>
  <text class="edge" x="914" y="170" text-anchor="middle">ok</text>

  <rect class="ok" x="940" y="140" width="220" height="80" rx="14"/>
  <text class="label" x="1050" y="166" text-anchor="middle">Completed</text>
  <text class="small" x="1050" y="188" text-anchor="middle">pushed for rollback</text>
  <text class="small" x="1050" y="208" text-anchor="middle">StepsCompleted + 1</text>

  <!-- skipped -->
  <path class="flow" d="M320,230 L320,298"/>
  <text class="edge" x="332" y="268">false</text>
  <rect class="note" x="220" y="300" width="200" height="80" rx="14"/>
  <text class="label" x="320" y="328" text-anchor="middle">Skipped</text>
  <text class="small" x="320" y="350" text-anchor="middle">not run, never undone</text>
  <text class="small" x="320" y="370" text-anchor="middle">StepsSkipped + 1</text>

  <!-- threw -->
  <path class="flow alt" d="M810,230 L810,288"/>
  <text class="edge" x="822" y="264">threw</text>
  <polygon class="decision" points="810,290 900,340 810,390 720,340"/>
  <text class="small" x="810" y="336" text-anchor="middle">OperationCanceled-</text>
  <text class="small" x="810" y="354" text-anchor="middle">Exception?</text>

  <path class="flow alt" d="M900,340 L938,340"/>
  <text class="edge" x="919" y="330" text-anchor="middle">yes</text>
  <rect class="fail" x="940" y="292" width="220" height="96" rx="14"/>
  <text class="label" x="1050" y="318" text-anchor="middle">Cancelled, rollback</text>
  <text class="small" x="1050" y="340" text-anchor="middle">never retried; TimedOut only when</text>
  <text class="small" x="1050" y="358" text-anchor="middle">this step's Timeout fired and</text>
  <text class="small" x="1050" y="376" text-anchor="middle">the run token was not cancelled</text>

  <path class="flow alt" d="M810,390 L810,438"/>
  <text class="edge" x="822" y="418">no</text>
  <polygon class="decision" points="810,440 900,490 810,540 720,490"/>
  <text class="code" x="810" y="487" text-anchor="middle">forwardRetry</text>
  <text class="small" x="810" y="505" text-anchor="middle">attempts left?</text>

  <!-- retry loop -->
  <path class="flow" d="M720,490 L682,490"/>
  <text class="edge" x="701" y="480" text-anchor="middle">yes</text>
  <rect class="step" x="460" y="450" width="220" height="80" rx="14"/>
  <text class="label" x="570" y="476" text-anchor="middle">Backoff wait</text>
  <text class="code" x="570" y="498" text-anchor="middle">DelayBeforeAttempt(n)</text>
  <text class="small" x="570" y="518" text-anchor="middle">constant or exponential</text>
  <path class="flow back" d="M570,450 L570,222"/>
  <text class="edge" x="558" y="340" text-anchor="end">next attempt,</text>
  <text class="edge" x="558" y="358" text-anchor="end">fresh Timeout</text>

  <!-- failed -->
  <path class="flow alt" d="M810,540 L810,578"/>
  <text class="edge" x="822" y="564">no</text>
  <rect class="fail" x="700" y="580" width="220" height="72" rx="14"/>
  <text class="label" x="810" y="610" text-anchor="middle">Failed, rollback</text>
  <text class="small" x="810" y="632" text-anchor="middle">Failure = the last exception</text>

  <!-- note -->
  <rect class="note" x="40" y="560" width="400" height="92" rx="10"/>
  <text class="small" x="56" y="586">A condition that throws ends the run as Failed, with no retry.</text>
  <text class="small" x="56" y="608">The Timeout is cooperative: a step that ignores its token</text>
  <text class="small" x="56" y="630">runs past it, and counts as completed if it then returns.</text>
</svg>
