<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="556" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionSaga - run forward, unwind on failure</text>
  <text class="subtitle" x="40" y="78">The quick-start order saga: book-courier throws, so the two completed steps are undone, newest first.</text>

  <!-- forward row -->
  <rect class="step" x="40" y="120" width="160" height="72" rx="14"/>
  <text class="code" x="120" y="152" text-anchor="middle">RunAsync</text>
  <text class="small" x="120" y="174" text-anchor="middle">(context, token)</text>
  <path class="flow" d="M200,156 L248,156"/>

  <rect class="step" x="250" y="120" width="200" height="72" rx="14"/>
  <text class="label" x="350" y="152" text-anchor="middle">reserve-stock</text>
  <text class="small" x="350" y="174" text-anchor="middle">step 1 forward</text>
  <path class="flow" d="M450,156 L498,156"/>
  <text class="edge" x="474" y="146" text-anchor="middle">ok</text>

  <rect class="step" x="500" y="120" width="200" height="72" rx="14"/>
  <text class="label" x="600" y="152" text-anchor="middle">charge-card</text>
  <text class="small" x="600" y="174" text-anchor="middle">step 2 forward</text>
  <path class="flow" d="M700,156 L748,156"/>
  <text class="edge" x="724" y="146" text-anchor="middle">ok</text>

  <rect class="step" x="750" y="120" width="200" height="72" rx="14"/>
  <text class="label" x="850" y="152" text-anchor="middle">book-courier</text>
  <text class="small" x="850" y="174" text-anchor="middle">step 3 forward</text>
  <path class="flow" d="M950,156 L998,156"/>
  <text class="edge" x="974" y="146" text-anchor="middle">ok</text>

  <rect class="ok" x="1000" y="120" width="160" height="72" rx="14"/>
  <text class="label" x="1080" y="152" text-anchor="middle">Succeeded</text>
  <text class="small" x="1080" y="174" text-anchor="middle">nothing undone</text>

  <!-- failure -->
  <path class="flow alt" d="M850,192 L850,258"/>
  <text class="edge" x="862" y="222">throws: Failed</text>
  <text class="edge" x="862" y="240">OperationCanceledException: Cancelled</text>

  <rect class="fail" x="750" y="260" width="200" height="72" rx="14"/>
  <text class="label" x="850" y="290" text-anchor="middle">book-courier ends it</text>
  <text class="small" x="850" y="312" text-anchor="middle">not undone: it never completed</text>

  <!-- rollback row, right to left -->
  <path class="flow alt" d="M750,296 L702,296"/>
  <rect class="step" x="500" y="260" width="200" height="72" rx="14"/>
  <text class="label" x="600" y="290" text-anchor="middle">undo charge-card</text>
  <text class="small" x="600" y="312" text-anchor="middle">step 2 compensation</text>

  <path class="flow alt" d="M500,296 L452,296"/>
  <rect class="step" x="250" y="260" width="200" height="72" rx="14"/>
  <text class="label" x="350" y="290" text-anchor="middle">undo reserve-stock</text>
  <text class="small" x="350" y="312" text-anchor="middle">step 1 compensation</text>

  <text class="small" x="40" y="286">rollback token: not the</text>
  <text class="small" x="40" y="304">run's token; cancelled only</text>
  <text class="small" x="40" y="322">by WithRollbackBudget</text>

  <!-- result -->
  <path class="flow" d="M350,332 L350,398"/>
  <text class="edge" x="362" y="370">every undo succeeded</text>
  <rect class="fail" x="40" y="400" width="420" height="126" rx="14"/>
  <text class="label" x="60" y="428">SagaResult, Outcome = Failed</text>
  <text class="small" x="60" y="452">FailedStep = "book-courier", Failure = its exception</text>
  <text class="small" x="60" y="474">StepsCompleted = 2, StepsCompensated = 2</text>
  <text class="small" x="60" y="496">CompensationFailures empty, RolledBackCleanly = true</text>
  <text class="small" x="60" y="516">(Outcome = Cancelled for an OperationCanceledException)</text>

  <!-- compensation failure -->
  <path class="flow alt" d="M600,332 L600,398"/>
  <text class="edge" x="612" y="370">an undo throws (after any compensation retry)</text>
  <rect class="fail" x="500" y="400" width="660" height="126" rx="14"/>
  <text class="label" x="520" y="428">Compensation failure: recorded, rollback goes on</text>
  <text class="small" x="520" y="452">Added to CompensationFailures as (StepName, Exception); the remaining undos still run.</text>
  <text class="small" x="520" y="474">StepsCompensated counts only the clean undos, and RolledBackCleanly = false.</text>
  <text class="small" x="520" y="496">With WithRollbackBudget, undos still pending when the budget elapses are recorded</text>
  <text class="small" x="520" y="516">as failures with an OperationCanceledException, and RollbackTimedOut = true.</text>
</svg>
