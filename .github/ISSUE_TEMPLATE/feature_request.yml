name: Feature request
description: Ask for something OrionSaga cannot do yet.
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        The bar here is "does it make the package clearer, faster, or safer without expanding the
        public surface needlessly". A request that names the real workload behind it is far more
        likely to land than one that names only the API shape it wants.

        Check [docs/ROADMAP.md](https://github.com/tunahanaliozturk/OrionSaga/blob/main/docs/ROADMAP.md)
        first: it lists what is planned (a test helper package, an outbox bridge, a durable saga store)
        and what is out of scope. If your request is a roadmap item, name it in the title and describe
        the workload that needs it.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Where the feature would live.
      options:
        - OrionSaga
        - A new companion package
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: The workload you are trying to serve, and what it costs you today. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: The workaround you are living with, or the other library you reach for, and why it is not good enough.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: If you have a shape in mind, show the call site as you would want to write it. Optional; the problem matters more.
      render: csharp
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to send the pull request for this.
          required: false
